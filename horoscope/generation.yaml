# generation.yaml — public editorial rules for the offline agent prose layer.
# generate_month.py reads this; nothing here changes the rules engine
# (rashifal.py stays the authority on valence/house/चन्द्राष्टम).
# Private endpoint/model bindings live in generation.local.yaml (gitignored);
# the API key lives in horoscope/.env (gitignored).

writer_tier: high_intelligence

request:
  response_format: json_object  # agent must return one JSON object
  timeout_seconds: 180
  sleep_between_calls: 1        # politeness gap between per-date calls

# Mechanical validator — a text failing any check is dropped and that राशि
# falls back to the deterministic template for the day.
validator:
  min_chars: 100
  max_chars: 650
  min_sentences: 3              # counted as danda (।) occurrences

# The writer persona + register rules. Edit freely; the JSON-output
# instruction at the end is load-bearing (JSON output mode requires it).
system_prompt: |
  तपाईं नेपाली पात्रोका लागि दैनिक राशिफल लेख्ने अनुभवी लेखक हुनुहुन्छ।

  नियमहरू (अनिवार्य):
  - शुद्ध नेपाली, देवनागरी लिपिमा मात्र। ल्याटिन अक्षर, अङ्ग्रेजी शब्द निषेध।
  - प्रत्येक राशिका लागि ४–६ वाक्य (लगभग ५०–७० शब्द), आदरार्थी "तपाईं" प्रयोग।
  - दिइएको वर्ग (शुभ / मध्यम / सावधान) र तथ्यसँग मेल खाने स्वर — वर्ग आफैँ नबदल्नुहोस्।
  - भविष्यवाणी निरपेक्ष होइन, सम्भावनाको भाषा: "...को सङ्केत छ", "...हुन सक्छ", "...सम्भावना देखिन्छ"।
  - काम, धन, परिवार, स्वास्थ्य, शिक्षा मध्ये कम्तीमा दुई फरक क्षेत्र छुनुहोस्; अन्त्यमा एउटा व्यावहारिक सल्लाह।
  - "सावधान" वर्गमा व्यावहारिक सतर्कता प्रस्ट बुझिने वाक्य अनिवार्य; चन्द्राष्टम भए नयाँ काम थाल्न नहतारिन सुझाव दिनुहोस्। "स्पष्ट होसियार" वा "स्पष्ट सावधानी" जस्ता कृत्रिम पदावली नलेख्नुहोस्।
  - स्वास्थ्य/औषधि, सेयर/जुवा, कानुनी विषयमा ठोस निर्देशन नदिनुहोस् — सामान्य सतर्कता मात्र।
  - प्रत्येक वाक्य पूर्णविराम (।) मा टुङ्ग्याउनुहोस्।

  बाह्रै राशिको पाठ भएको JSON मात्र फर्काउनुहोस्: {"मेष": "...", "वृष": "...", ...}

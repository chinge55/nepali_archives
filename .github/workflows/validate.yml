name: Validate contributions

# Fast feedback on pull requests: checks the SOURCES a contribution touches
# (metadata.json, text.txt, rights, slug rules) and that the site still builds.
# Build artifacts are regenerated by deploy.yml on merge — never committed.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      # 1) metadata schema, slug/id rules, text.txt sanity, rights gate
      - run: python3 pipeline/validate.py
      # 2) public-source hygiene: private local bindings stay private
      - run: python3 pipeline/check_public_tree.py
      # 3) archived pages contain no executable or comment data
      - run: python3 pipeline/sanitize_extracted_html.py --check
      # 4) site-generator unit and fixture-build tests
      - run: python3 -m unittest discover -s pipeline/tests
      # 5) dry-run the real build and audit generated links (nothing is deployed)
      - run: python3 pipeline/build_index.py
      - run: python3 pipeline/build_site.py
      - run: python3 pipeline/check_site_links.py site

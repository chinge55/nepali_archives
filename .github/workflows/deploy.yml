name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: r-lib/actions/setup-pandoc@v2      # for reader.epub
      - run: pip install fonttools brotli         # for the font subset
      # The repo holds ONLY sources (metadata.json, text.txt, source PDF/HTML). Every
      # derived artifact below is rebuilt here, so contributors never commit build output.
      - run: python3 pipeline/build_index.py             # archives/index.json
      - run: python3 pipeline/build_formats.py --all      # reader.html + reader.epub per work
      - run: python3 pipeline/build_site.py               # site/ (pass 1 — HTML for glyph scan)
      - run: python3 pipeline/subset_fonts.py             # assets/fonts/*.woff2 (subset to used glyphs)
      - run: python3 pipeline/build_site.py               # site/ (pass 2 — embed the subset)
      - run: npx -y pagefind@1.5.2 --site site            # full-text search index → site/pagefind/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

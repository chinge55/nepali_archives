name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # build_site.py is pure Python stdlib (archives/, assets/fonts/, the Act PDF are
      # all committed); it also emits the roman→Devanagari search-bridge shards.
      - run: python3 pipeline/build_site.py
      # Full-text search: Pagefind indexes the built HTML in place, writing site/pagefind/.
      # Pinned prebuilt binary, fetched at build time. Must run AFTER build_site.py
      # (which wipes & rebuilds site/). Together these power the home-page in-text search.
      - run: npx -y pagefind@1.5.2 --site site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<span /><div class="chapter-title" style="text-align:center;"><span style="font-size:144%;"><b>क्रान्तिस्तुति</b></span></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>म गर्छु देशसेवा बल देऊ लौ मलाई<br />
मबाट होस् सबैको आनन्द औ भलाइ<br />
तिम्रै गरी पुकारा अर्पण गरेर भेटी<br />
हामी भयौँ फुका सब दासत्वलाई मेटी<br />
ए शम्भु लौ मलाई बल देऊ लौ मलाई<br />
म गर्छु देशसेवा बल देऊ लौ मलाई ।
</p>

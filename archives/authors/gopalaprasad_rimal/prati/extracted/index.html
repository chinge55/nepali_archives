<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>"..." प्रति</title></head><body><section id="section-1">
    <div class="mw-content-ltr mw-parser-output" dir="ltr" lang="en-GB"><div class="prp-pages-output" lang="ne">
<span /><div class="chapter-title" style="text-align:center;"><span style="font-size:144%;"><b>"..." प्रति</b></span></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>कुन्नि (कुन अल्लारेपनमा)<br />
कुन जून लिपेको सरमा,<br />
कुन सूर्य फुलेको नभमा,<br />
कुन चरीको बोली फुटेको,<br />
कुन फूल फुलेको वनमा,<br />
कुन पर्वतको काखमा,<br />
कुन शान्ति-नदी तटमा<br />
मैले चुनेथेँ घर !<br />
<span class="mw-poem-indented" style="display: inline-block; margin-inline-start: 2em;">अब ती घरका खर गारा</span><br />
<span class="mw-poem-indented" style="display: inline-block; margin-inline-start: 2em;">हुरी-भुमरीमा घुम्छन्,</span><br />
<span class="mw-poem-indented" style="display: inline-block; margin-inline-start: 2em;">हेर्न नसकी चुहिँदा यी आँखा</span><br />
<span class="mw-poem-indented" style="display: inline-block; margin-inline-start: 2em;">पग्लिन्छन् ! थुनिन्छन् !</span>
</p>
</div>
</div>
<div style="text-align:right;">
<p>उद्योग, जेठ, १९९५
</p>
</div>
</div>
</div>

<span /><div class="chapter-title" style="text-align:center;"><span style="font-size:144%;"><b>गीत</b></span></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>बखत भयो यही हो बेला नजर उघारी हेरिदेऊ<br />
त्यो दिलबाट तमस हटाई उज्यालो हावा फैलाइदेऊ<br />
जो देख्छौ हालत भित्री तहको<br />
तिमीलाई अन्य भनूँ म कसरी ?<br />
जो सुन्छौ आवाज भित्री मनको<br />
तिमीलाई वैरी भनूँ म कसरी ?<br />
हे देवी दुर्गे, जगत्‌की आमा, पुकार हाम्रो सुनिदेऊ<br />
हामी नेपाली हाम्रो यो भाव सबमा जगाइदेऊ ।
</p>

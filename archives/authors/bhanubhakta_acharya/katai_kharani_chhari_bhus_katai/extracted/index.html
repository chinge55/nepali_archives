<?xml version='1.0' encoding='utf-8'?>
<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>कतै खरानी छरि भुस्‌ कतै ता</title></head><body><section id="section-1"><div class="chapter-title">कतै खरानी छरि भुस्‌ कतै ता</div><p><span>२४</span><br /><span>कतै खरानी छरि भुस्‌ कतै ता,</span><br /><span>कतै कसिङ्गर्‌ कनिका कतै ता ।</span><br /><span>सुत्न्या दिनैदिन्‌ इलमै बिगारी,</span><br /><span>तेस्लाइ ता भन्नु सुँगुर्नि नारी ॥</span><br /><span>झार्दी न लिप्ती मइली छ धेर,</span><br /><span>गर्न्या कुरा धेर् घर-घर्‌ डुलेर</span><br /><span>राख्न्या ति भाँडा सब नील पारी,</span><br /><span>यो चाँहि हो खास कुकुर्नि नारी ॥</span></p></section></body></html>

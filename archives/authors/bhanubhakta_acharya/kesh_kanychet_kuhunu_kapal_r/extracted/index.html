<?xml version='1.0' encoding='utf-8'?>
<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>केश्‌ कञ्चेट्‌ कुहुनू कपाल्‌ र कलेजो काखी करङ्‌ कन्सिरी</title></head><body><section id="section-1"><div class="chapter-title">केश्‌ कञ्चेट्‌ कुहुनू कपाल्‌ र कलेजो काखी करङ्‌ कन्सिरी</div><p><span>२०</span><br /><span>केश्‌ कञ्चेट्‌ कुहुनू कपाल्‌ र कलेजो काखी करङ्‌ कन्सिरी,</span><br /><span>कान्यागूजि र कुर्कुचा कटि र कान्‌ कम्मर्‌ र कापा पनी ।</span><br /><span>कान्छिउम्‌लि र काँध कुम्‌ पनि भया कण्ढो र कोखो समेत्‌,</span><br /><span>कम्पारो जियमा कदेखि उठन्या बिस्‌थोक्‌ इनै हुन्‌ बुझ ॥</span></p></section></body></html>

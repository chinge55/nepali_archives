<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>मास्‌ भृङ्गी बेल दूभो बयर धतुरो तूलसीका अपाङ्‌का</title></head><body><section id="section-1"><div class="chapter-title">मास्‌ भृङ्गी बेल दूभो बयर धतुरो तूलसीका अपाङ्‌का</div><p><span>२१</span><br /><span>मास्‌ भृङ्गी बेल दूभो बयर धतुरो तूलसीका अपाङ्‌का</span><br /><span>बीहींका पात्‌ शमीका करविर असऊ आँक गुम्पातिका पात्‌ ।</span><br /><span>विष्णूकान्ता र दारिम्‌ सुरतरु र कुरो सिन्दुर्‍याका जयन्ती</span><br /><span>फुल्‌कागीँ देरिका पात्‌ लिनु बटुलि गणेश्‌चौथिका दीनमा साथ्‌ ॥</span></p></section></body></html>

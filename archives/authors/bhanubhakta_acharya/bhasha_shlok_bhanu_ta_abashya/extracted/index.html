<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>भाषा श्लोक्‌ भनु ता अवश्य अरु ता बुझ्दैन कोई पनी</title></head><body><section id="section-1"><div class="chapter-title">भाषा श्लोक्‌ भनु ता अवश्य अरु ता बुझ्दैन कोई पनी</div><p><span>१६</span><br /><span>भाषा श्लोक्‌ भनु ता अवश्य अरु ता बुझ्दैन कोई पनी,</span><br /><span>संस्कृत्‌ हुन्‌ भनु ता इ शास्त्रिहरुता धेर्‌ छन्‌ अशुद्धा भनी ।</span><br /><span>भन्छन्‌ आज ठिमाहका गणितमा तिम्म्रा शिलोक् ई गया,</span><br /><span>भाषा श्लोक बनाइ राख तिमि नाक्‌ बुद्धी र बर्गत्‌ भया ॥</span></p></section></body></html>

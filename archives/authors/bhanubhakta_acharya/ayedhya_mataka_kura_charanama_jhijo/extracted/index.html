<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>आयेध्या मतका कुरा चरणमा झीजो गरम्‌ क्वै भनी</title></head><body><section id="section-1"><div class="chapter-title">आयेध्या मतका कुरा चरणमा झीजो गरम्‌ क्वै भनी</div><p><span>३१</span><br /><span>आयेध्या मतका कुरा चरणमा झीजो गरम्‌ क्वै भनी,</span><br /><span>दर्शन्‌ पाइन फर्कि जान्छु अहिले हाँजिर्‌ जनाई अनी ।</span><br /><span>हींड्या घर्‌-तिर आज ता, घर पुगी फर्केर आई अब,</span><br /><span>गन्थन्‌ ई मनका कुरा चरणमा बिन्ती गरूँला सब ॥</span></p></section></body></html>

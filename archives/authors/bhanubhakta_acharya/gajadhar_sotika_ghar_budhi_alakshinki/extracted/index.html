<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>गजाधर्‌ सोतीका घर बुढि अलक्षिन्‌कि रहिछन्‌</title></head><body><section id="section-1"><div class="chapter-title">गजाधर्‌ सोतीका घर बुढि अलक्षिन्‌कि रहिछन्‌</div><p><span>१२</span><br /><span>गजाधर्‌ सोतीका घर बुढि अलक्षिन्‌कि रहिछन्‌,</span><br /><span>नरक् जानालाई सवसित विदावादि भइछन्‌ ।</span><br /><span>गयौं साँज्‌मा तिन्‌का घर पिंडिमाँहाँ वास गरियो,</span><br /><span>निकालीन्‌ साजैमा अलिक पर गुज्ज्रान गरियो ॥</span></p></section></body></html>

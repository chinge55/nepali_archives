<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>क्वै उठ्छन्‌ त सबेरमा ति धनकै खाँतीरका काम्‌ लिई</title></head><body><section id="section-1"><div class="chapter-title">क्वै उठ्छन्‌ त सबेरमा ति धनकै खाँतीरका काम्‌ लिई</div><p><span>३७</span><br /><span>क्वै उठ्छन्‌ त सबेरमा ति धनकै खाँतीरका काम्‌ लिई,</span><br /><span>दौड्याका परदेश घर्‌ घर धनै-वृद्धी विषे मन्‌ दिई ।</span><br /><span>धन्‌ ठूलो बुझि धर्म छोडि पनि धन्‌ घर्‌भित्र भर्‌छन्‌ ञहाँ,</span><br /><span>सब्‌ छोडी मरि जानु पर्दछ नरक्‌ चेत्नन्‌ अनी पो वहाँ ॥</span></p></section></body></html>

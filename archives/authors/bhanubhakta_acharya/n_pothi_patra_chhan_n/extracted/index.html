<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>न पोथी पात्रा छन्‌ न कलम मस्यानी छ सँगमा</title></head><body><section id="section-1"><div class="chapter-title">न पोथी पात्रा छन्‌ न कलम मस्यानी छ सँगमा</div><p><span>१८</span><br /><span>न पोथी पात्रा छन्‌ न कलम मस्यानी छ सँगमा,</span><br /><span>सधैं हुक्का नारी थरकि फिंजि खेल्छौ चयनमा ।</span><br /><span>कती विर्ता तिम्म्रो कति छ धन दौलथ्‌ यस घरी,</span><br /><span>उडायौ आर्ज्याको जति अब गया वाबु त मरी ॥</span></p></section></body></html>

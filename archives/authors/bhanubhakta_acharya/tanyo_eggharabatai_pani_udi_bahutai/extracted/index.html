<?xml version='1.0' encoding='utf-8'?>
<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>तान्यो एग्घारबाटै पनि उँडि बहुतै चक्किले दिग्‌ गरायो</title></head><body><section id="section-1"><div class="chapter-title">तान्यो एग्घारबाटै पनि उँडि बहुतै चक्किले दिग्‌ गरायो</div><p><span>२६</span><br /><span>तान्यो एग्घारबाटै पनि उँडि बहुतै चक्किले दिग्‌ गरायो,</span><br /><span>एक्‌छिन्‌ पाशा विचार्‍याँ उहिं पनि गइ झन्‌ आउन्या आश् हरायो ।</span><br /><span>छक्का लिम्‌ पर्छ चौका यहि रित हुन गो चक्कि पाशा छरूवा,</span><br /><span>खेल्दामा साठी हार्‍याँ दिन पनि सकियो आज भय्यो हरूवा ॥</span></p></section></body></html>

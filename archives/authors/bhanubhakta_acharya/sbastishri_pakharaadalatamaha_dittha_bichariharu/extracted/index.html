<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>स्वस्तिश्री पखरा-अदालतमहाँ डिट्ठा विचारीहरू</title></head><body><section id="section-1"><div class="chapter-title">स्वस्तिश्री पखरा-अदालतमहाँ डिट्ठा विचारीहरू</div><p><span>३०</span><br /><span>स्वस्तिश्री पखरा-अदालतमहाँ डिट्ठा विचारीहरू</span><br /><span>पाऊमा परि बिन्ति गर्छु अहिले बेरामि छू क्या गरू</span><br /><span>मेरो म्याद रहोस्‌ सकीन अहिले आऊँन यो म्यादमा,</span><br /><span>गर्न्याछू वकपत्र येहि मितिले एक्‌ मासका भित्रमा ॥</span></p></section></body></html>

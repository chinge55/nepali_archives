<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>न मृत्यु टर्न्या हो यसरि झगडामा अघि सरी</title></head><body><section id="section-1"><div class="chapter-title">न मृत्यु टर्न्या हो यसरि झगडामा अघि सरी</div><p><span>९</span><br /><span>न मृत्यु टर्न्या हो यसरि झगडामा अघि सरी,</span><br /><span>न कोटिन्‌को मालिक् हुनु छ घरमा दौलथ भरी ।</span><br /><span>बिहक्‌मा दिन्‌ जान्छन्‌ तब मन बुझाऊँ म कसरी,</span><br /><span>कृपा राखी ख्वामित्‌ अब छिनिदिनोस्‌ हुन्छ जसरी ॥</span></p></section></body></html>

<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>तिन्‌ सात्‌ एग्घार पन्ध्रै कउडि खडि भया दाउ त्यो हुन्छ तीया</title></head><body><section id="section-1"><div class="chapter-title">तिन्‌ सात्‌ एग्घार पन्ध्रै कउडि खडि भया दाउ त्यो हुन्छ तीया</div><p><span>२५</span><br /><span>तिन्‌ सात्‌ एग्घार पन्ध्रै कउडि खडि भया दाउ त्यो हुन्छ तीया,</span><br /><span>चार्‌ आठ् बाह्रै र साह्रै चित घवट जउन्‌ होस त्यो हुन्छ चौका ।</span><br /><span>एक्‌ पाँच्‌ नौ तेह्र ठाडा बुझिलिनु यिनको दाउ पञ्जा छ पक्का,</span><br /><span>दुईटा वा छ ओटा दश चउध खडा कौडि हुन्छन्‌ त छक्का ॥</span></p></section></body></html>

<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>क्याले भुल्छौ जगत्‌मा नरहरु बहुतै दुःखले पक्रिएका</title></head><body><section id="section-1"><div class="chapter-title">क्याले भुल्छौ जगत्‌मा नरहरु बहुतै दुःखले पक्रिएका</div><p><span>३९</span><br /><span>क्याले भुल्छौ जगत्‌मा नरहरु बहुतै दुःखले पक्रिएका,</span><br /><span>सब्‌का शिर्‌माथि लाठी दिन-दिन यमका वज्र नै टक्रिएका ।</span><br /><span>देख्छौ सुन्छौ कहन्छौ अझ हरि नभजी वित्तमै चित्त लायौ,</span><br /><span>ताप् होला खुप्‌ मरण्‌मा हरि भज नभजी व्यर्थ सब्‌ दिन्‌ बितायौ ॥</span></p></section></body></html>

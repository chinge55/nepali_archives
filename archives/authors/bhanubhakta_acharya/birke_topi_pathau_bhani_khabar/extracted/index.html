<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>विर्के टोपी पठाऊ भनि खबर हुँदा भेजियाको त टोपी</title></head><body><section id="section-1"><div class="chapter-title">विर्के टोपी पठाऊ भनि खबर हुँदा भेजियाको त टोपी</div><p><span>१५</span><br /><span>विर्के टोपी पठाऊ भनि खबर हुँदा भेजियाको त टोपी</span><br /><span>माथ्‌मा राख्‌ता त सानै भइगयछ अहो ! क्या भयो टूपि छोपी ।</span><br /><span>तस्मात्‌ त्यो टोपि हाम्रा घर दिन्‌ वढिया टोपि आर्को पठाई,</span><br /><span>नानी खूसी गरम्‌ला मुख गरि हँसिलो लाउला माथ्‌ अटाई ॥</span></p></section></body></html>

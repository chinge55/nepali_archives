<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>असल्‌ मुङ्ग्रे केरा कि त महि हवस्‌ बेस अमिलो</title></head><body><section id="section-1"><div class="chapter-title">असल्‌ मुङ्ग्रे केरा कि त महि हवस्‌ बेस अमिलो</div><p><span>११</span><br /><span>असल्‌ मुङ्ग्रे केरा कि त महि हवस्‌ बेस अमिलो</span><br /><span>कि ता सेता मूला कि त बरु हवस्‌ साग उसको ।</span><br /><span>असल्‌ हुन्थ्यो धूप्‌मा नतर यसरी खानु कसरी ।</span><br /><span>भुटी ल्यायौ थाल्‌मा मकइ तिमिले क्याँन यसरी ॥</span></p></section></body></html>

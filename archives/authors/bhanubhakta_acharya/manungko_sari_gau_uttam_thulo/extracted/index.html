<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>मानुङ्‌को सरि गाउँ उत्तम ठुलो लागेन काँहीं पनी</title></head><body><section id="section-1"><div class="chapter-title">मानुङ्‌को सरि गाउँ उत्तम ठुलो लागेन काँहीं पनी</div><p><span>३३</span><br /><span>मानुङ्‌को सरि गाउँ उत्तम ठुलो लागेन काँहीं पनी,</span><br /><span>वास्नालाइ रमाइला अति चिसो आऊँछ हावा पनी ।</span><br /><span>घर्‌मा नै बसि फेर्‌ हिमालयजिको बाराहिजीको पनी,</span><br /><span>शुक्ला दक्षिण तर्फ उत्तर दिशा माहेन्द्रि दर्शन्‌ पनी ॥</span></p></section></body></html>

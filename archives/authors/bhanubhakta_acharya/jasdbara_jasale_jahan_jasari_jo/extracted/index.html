<?xml version='1.0' encoding='utf-8'?>
<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>जस्‌द्वारा जसले जहां जसरि जो गर्छन्‌ त जुन्‌ जुन्‌ घरी</title></head><body><section id="section-1"><div class="chapter-title">जस्‌द्वारा जसले जहां जसरि जो गर्छन्‌ त जुन्‌ जुन्‌ घरी</div><p><span>१७</span><br /><span>जस्‌द्वारा जसले जहां जसरि जो गर्छन्‌ त जुन्‌ जुन्‌ घरी,</span><br /><span>उस्‌द्वार उसको वहां उ फलभोग्‌ छुट्तैन कस्तै गरी ।</span><br /><span>प्रारब्धै वलवान्‌ छ सर्व जनको प्रारब्ध-भोग्‌ गर्दछन्‌,</span><br /><span>आफ्नू काम छिपाइ दोष्‌कन दिन्या व्यर्थै नरक् पर्दछन्‌ ॥</span></p></section></body></html>

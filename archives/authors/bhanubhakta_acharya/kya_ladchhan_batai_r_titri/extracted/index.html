<?xml version='1.0' encoding='utf-8'?>
<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>क्या लड्छन्‌ बटई र तित्रि चखुरा साँडे पहल्मान्‌हरू</title></head><body><section id="section-1"><div class="chapter-title">क्या लड्छन्‌ बटई र तित्रि चखुरा साँडे पहल्मान्‌हरू</div><p><span>२७</span><br /><span>क्या लड्छन्‌ बटई र तित्रि चखुरा साँडे पहल्मान्‌हरू,</span><br /><span>अर्ना भैंसि र सिंह हात्ति कुखुरा लड्छन्‌ ति एक्‌छिन्‌ बरू ।</span><br /><span>राज्ज्यैको थप गर्न मन्सुव हुदा लड्छन्‌ कि राजाहरू,</span><br /><span>की ता स्वामिनिमित्त नित्य घरमा लड्छन्‌ इ सौताहरू ॥</span></p></section></body></html>

<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>ढीटा छन्‌ सब्‌ कुरा पूरा छोरा धेर्‌ जसका तिनै</title></head><body><section id="section-1"><div class="chapter-title">ढीटा छन्‌ सब्‌ कुरा पूरा छोरा धेर्‌ जसका तिनै</div><p><span>१९</span><br /><span>ढीटा छन्‌ सब्‌ कुरा पूरा छोरा धेर्‌ जसका तिनै ।</span><br /><span>धनी छन्‌ धनले क्यार्नू भन्दैछन्‌ अघिका बुढा ॥</span><br /><span>ढीटा भञ्छन्‌ त क्या भैगो सज्जन्‌का अघि बातमा ।</span><br /><span>बक-बक्‌-बक्‌-बक्‌ त जो गर्छन्‌ मूर्खै हुन्‌ ति भनुन्‌ बुढा ॥</span></p></section></body></html>

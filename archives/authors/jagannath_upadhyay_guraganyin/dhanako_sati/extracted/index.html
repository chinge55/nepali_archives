<p><span />

<div class="chapter-title" style="text-align:center;"><span style="font-size:144%;"><b>धनको सती </b></span></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>घस्कोस् इज्जत् रसातल्तिर, अझ तल गै घोप्टियोस् पाजि जात,
</p>
</div>
<div style="margin-top:-1lh;" />
<p> <span />
</p>
<div class="poem">
<p>फूटोस् खप्पर् दयाको जप–तप पनि यी मन्टियुन् भीरबाट । <br />
ऐल्यै लागोस् डढेलो यिनी गुणहरुमा, धन मिले भो मलाई, <br />
जस्का खातीर सारा गुणहरु पनि ती गर्दछन् हाई–हाई ॥
</p>
</div>
</div>
<p><br />
</p>

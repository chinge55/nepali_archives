<div class="chapter-title" style="text-align:center;"><span style="font-size:144%;"><b>नाता पक्ष</b></span></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>पिता माता मामा दिदि बहिनी भाई कि भतिजा, <br />
फुपू सानीमा औ जति–जति छ नाता अरु निजा । <br />
बटूवा बाटामा मिलि छिन भरी एक सँगमा, <br />
बसी छुट्टीए झैँ अलिक दिनका छन् जगतमा ।
</p>

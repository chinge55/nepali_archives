<div class="poem">
<p><span style="display:inline-block; text-align:center; width:100% ;">(१)</span><br />
उपर कदमछाया, पासमा कामधेनु<br />
<span class="mw-poem-indented" style="display: inline-block; margin-inline-start: 2em;">प्रणयसित लिएको हातमा दिव्य वेणु ।</span><br />
मधुर युगल राधाकृष्णको मूर्ति खास<br />
<span class="mw-poem-indented" style="display: inline-block; margin-inline-start: 2em;">विषय-विकल मेरो चित्तमा होस्‌ प्रकाश ॥</span>
</p>

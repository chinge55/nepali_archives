<span /><div class="chapter-title" style="text-align:center;"><span style="font-size:144%;"><b>सम्झना</b></span></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>जब सम्झन्छु मन मन मेरो महिमा मोहन देश<br />
आँसु भरिंदै आउँछ गहमा सरसर बन्दछ केश ।
</p>
</div>
<div style="margin-top:-1lh;" />
<p> <span />
</p>
<div class="poem">
<p>कति कति गरुँला कति कति भरुँला सपनाहरु कति बेस<br />
भन्दछ दिलले गहमा जलले बोलून् बहुमुख शेष !<br />
किन किन किन हो हे जल-बूँद झर्छौं वर वर वेस<br />
कति छ बताउनु कति छ सुनाउनु हेरून् हृदय महेश !
</p>
</div>
</div>
</div>
</div>

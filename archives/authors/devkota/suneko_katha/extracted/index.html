<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>सुनेको कथा</title></head><body><section id="section-1">
    <div class="mw-content-ltr mw-parser-output" dir="ltr" lang="en-GB"><div class="prp-pages-output" lang="ne">
<span /><div class="chapter-title" style="text-align:center;"><span style="font-size:144%;"><b>सुनेको कथा</b></span></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p><span style="display:inline-block; text-align:center; width:100% ;">(१)</span><br />
जब सुन्दछु देश अरूहरुका<br />
<span class="mw-poem-indented" style="display: inline-block; margin-inline-start: 2em;">झलमल्ल कथा रसिला र निका ।</span><br />
तब आउँदछन् गहमा कनिका<br />
<span class="mw-poem-indented" style="display: inline-block; margin-inline-start: 2em;">सपनाहरुसाथ अनेक निका ॥</span><br />
<br />
<span style="display:inline-block; text-align:center; width:100% ;">(२)</span><br />
जब सुन्दछु वीर-कथा अघिका<br />
<span class="mw-poem-indented" style="display: inline-block; margin-inline-start: 2em;">मुटु फुल्दछ आउँछ एक ढिका ।</span><br />
यस देश बनाउन वीर बनी<br />
<span class="mw-poem-indented" style="display: inline-block; margin-inline-start: 2em;">सपनासरि बन्छु यहाँ म पनि ॥</span>
</p>
</div>
</div>
</div>
</div>

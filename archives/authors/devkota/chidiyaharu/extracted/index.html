<html xmlns="http://www.w3.org/1999/xhtml" lang="ne"><head><meta charset="utf-8" /><title>चिडियाहरू</title></head><body><div class="prp-pages-output" lang="ne">
<span /><div class="chapter-title" style="text-align:center;"><span style="font-size:144%;"><b>चिडियाहरू</b></span></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>उड, उड, रंगीबिरंगी चिडिया,<br />
लाख, लाखका ताँती !<br />
जन-मनमा गै नीड बनाउन !<br />
बच्चा काडन, बहुभाँती !<br />
<br />
उदयाचलका किरण परेका,<br />
इन्द्रेनीका पंखहरू !<br />
हाँगा हाँगा बास गरेथ्यौ<br />
बिकशी पंख, भरीकन मेरो<br />
जीवन-नामा हाँस्ने तरू ! <br />
<br />
पंख बढेका । जाओ कूजन<br />
मेरो ऊषाका गान !<br />
बोलिरहुँला ! तिम्रा स्वरमा<br />
उपहास गरी अवसान !
</p>
</div>

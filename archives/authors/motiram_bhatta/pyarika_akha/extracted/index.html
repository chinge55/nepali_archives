<div class="ct-top"><div style="text-align:center;"><b><span style="font-size:120%;">गजल २३</span></b></div></div>
<div class="ct-bottom"><div style="text-align:center;"><b><span style="font-size:144%;">प्यारिका आँखा…</span></b></div></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>प्यारिका आँखा भनी ली हालनू गुन्केसरी<br />
क्यै तफायत् देखिए ता फालनू गुन्केसरी ॥१॥<br />
<br />
जूहि जाई बेलि चम्पा केवरा क्या लाउनू,<br />
फूलको क्यै सोख गर्दा पालनू गुन्केसरी ॥२॥<br />
<br />
मन् मइन् भन्दा पनी बिघ्नै नरम् जाने हरी,<br />
जाँच गर्न्या छौ त मोती गालनू गुन्केसरी ॥३॥
</p>

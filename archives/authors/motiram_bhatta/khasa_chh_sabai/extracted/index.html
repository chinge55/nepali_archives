<div class="ct-top"><div style="text-align:center;"><b><span style="font-size:120%;">गजल १८</span></b></div></div>
<div class="ct-bottom"><div style="text-align:center;"><b><span style="font-size:144%;">खासा छ सबै…</span></b></div></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>खासा छ सबै रङ्गमा पोसाक बसन्ती,<br />
लाएर आउ अङ्गमा पोसाक बसन्ती ॥१॥
</p>
</div>
<p> <span />
</p>
<div class="poem">
<p>गुन्केसरी कपालमा कण्ठा जुहारको,<br />
लायक् छ सबै अङ्गमा पोसाक बसन्ती ॥२॥<br />
<br />
पैह्ला छ मोति हेर हरीको कउन् रवाब,<br />
यस्तो ऋतू बसन्तमा पोसाक बसन्ती ॥३॥
</p>
</div>
</div>
<p>
</p>

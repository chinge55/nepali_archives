<div class="ct-top"><div style="text-align:center;"><b><span style="font-size:144%;">बङ्गाली ठेटर्को</span></b></div></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>कति रोइ रोई मन बाधेकी छू ।<br />
तिम्रो त्यो प्रीति ता जानेकी छू ॥१॥<br />
<br />
ठूलो आशा थियो मन्‌मा ।<br />
सुखी हुला दुइ जना ॥<br />
त्यो सब् सम्झी सम्झी मन्‌मा रोएकी छू ॥२॥
</p>
</div>

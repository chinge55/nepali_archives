<div class="ct-top"><div style="text-align:center;"><b><span style="font-size:144%;">परज्</span></b></div></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>मेरो यौवन चुस्यो मुनिञाले,<br />
कसित सुनाऊँ कसित भनू म ॥१॥<br />
<br />
दुःख दियो पापि ससुराले,<br />
आफु भने परदेश रमाए ।<br />
रस लिदि हो नि बजिनी सौताले ॥२॥
</p>

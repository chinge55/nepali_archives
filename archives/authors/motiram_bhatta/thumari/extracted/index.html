<div class="ct-top"><div style="text-align:center;"><b><span style="font-size:144%;">ठुमरी</span></b></div></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>यसरी जिय राखुँ म ता कसरी,<br />
अज हेर नजर् जहरी जहरी ॥१॥<br />
<br />
अब अमृत रस् मुखमा नभरी,<br />
रहला कति मन नपरी नपरी ॥२॥<br />
<br />
झट आइ बचाउ मलाई हरी,<br />
अझसम्म म छू जसरी तसरी ॥३॥
</p>

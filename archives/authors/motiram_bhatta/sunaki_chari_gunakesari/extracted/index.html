<div class="ct-top"><div style="text-align:center;"><b><span style="font-size:120%;">गजल २७</span></b></div></div>
<div class="ct-bottom"><div style="text-align:center;"><b><span style="font-size:144%;">सुनकी चरी गुनकेसरी…</span></b></div></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>सुनकी चरी गुनकेसरी सुनले भरी मन के गरी,<br />
सुनका दरी अघिकै सरी सुन बन्‌विशे कसरी धरी ॥१॥<br />
<br />
जब मर्दछिन् ति भनी सुने मनमा म ताजुब भै गयें,<br />
रस ओठको अमृतै न हो तब सुन्दरी कसरी मरी ॥२॥<br />
<br />
जप माल हात छ मोतिको हरिका भने तव भै गयो,<br />
लिन नै परेछ अखीर् परी यसरी मलाइ नकच्वरी ॥३॥
</p>
</div>

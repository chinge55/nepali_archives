<div class="ct-bottom"><div style="text-align:center;"><b><span style="font-size:144%;">गजप्‌को देखियो…</span></b></div></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>गजप्‌को देखियो त्यो चन्द्रमा ताहाँ उदाएको,<br />
पलक्‌मा होस नै पाईन मन् याहाँ उडाएको ॥१॥<br />
<br />
कसोरी घट्न जावैनन् यसै पल्‌पल् गरी तन् मन्,<br />
बिना तारो उसै रिस्‌ले धनू तिम्‌ले नुहाएको ॥२॥<br />
<br />
हरीको देखियो चाला म हर्दम् हुन्छु रख्वाला,<br />
गलामा मोतिको माला मजाको क्या सुहाएको ॥३॥
</p>
</div>

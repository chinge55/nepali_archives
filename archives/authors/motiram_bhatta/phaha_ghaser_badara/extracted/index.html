<div class="ct-top"><div style="text-align:center;"><b><span style="font-size:120%;">गजल ४</span></b></div></div>
<div class="ct-bottom"><div style="text-align:center;"><b><span style="font-size:144%;">फाहा घसेर बादरा…</span></b></div></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>फाहा घसेर बादरा हज्जार लगाये,<br />
बिन्ती छ बिन्ती सुन्दरी मिस्सी नलगाये ॥१॥<br />
<br />
ठट्टा गर्‍यौ त बेस् गर्‍यौ हुन्छ सहन्छु,<br />
मैले पनी गरें भने तिम्‌ले नरिसाये ॥२॥<br />
<br />
बाजा बजाउ सुन्दछु एक् मन् दिई हरी,<br />
मोती भनेर कोइ गजल् गीत नगाये ॥३॥
</p>
</div>

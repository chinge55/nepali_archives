<div class="ct-top"><div style="text-align:center;"><b><span style="font-size:144%;">भैरवी</span></b></div></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>हिलिमिलि महिपी जाऊँ मतको पाप छुटाऊँ ।<br />
विस्नुमतिको चीसो पानी लगिकन देबि नहाऊँ ॥ हिली०<br />
<br />
बेलि चमेली जूही जाई टिपि टिपि माथ चढाऊँ ॥ हिलि०<br />
जगतकि जननी महिपी माई गइकन दर्शन पाऊँ ॥ हिलि०
</p>

<div class="ct-top"><div style="text-align:center;"><b><span style="font-size:120%;">गजल १०</span></b></div></div>
<div class="ct-bottom"><div style="text-align:center;"><b><span style="font-size:144%;">हेर काहाँदेखि…</span></b></div></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>हेर काँहाँदेखि आयो, आज यस्तो जुन्किरी,<br />
मुस्किलै पर्नेछ फेरि, देख्नु यस्तो जुन्किरी ॥१॥<br />
<br />
क्या चटाकी उड्नको, क्या चम्कनू बेजानको,<br />
देखियो ऐले न झन् मन्, हर्न कस्तो जुन्किरी ॥२॥<br />
<br />
केहि वेर् चम्कन्छ याहाँ, फेरि देखिने तहाँ,<br />
हेरिल्यौ जाहाँ तहाँ जूहार जस्तो जुन्किरी ॥३॥
</p>
